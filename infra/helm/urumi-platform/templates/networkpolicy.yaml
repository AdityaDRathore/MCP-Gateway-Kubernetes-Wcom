  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming MCP traffic only from intended gateway workloads
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: gateway
        {{- if .Values.networkPolicy.allowTestClient }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: test-client
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.upstreams.crm.service.port | default 3000 }}
  egress:
    # DNS resolution only (zero external or database egress)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
