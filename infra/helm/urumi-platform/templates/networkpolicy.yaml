{{- if and .Values.networkPolicy .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: urumi-gateway-netpol
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow public MCP traffic routed through Traefik ingress controller in kube-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port | default 3000 }}
    {{- if .Values.networkPolicy.allowTestClient }}
    # 2. Explicitly local-only exception for development verification
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: test-client
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port | default 3000 }}
    {{- end }}
  egress:
    # 1. Allow CoreDNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow egress strictly to approved upstream MCP services on port 3000
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - mcp-woocommerce
                  - mcp-crm
                  - mcp-tasks
      ports:
        - protocol: TCP
          port: 3000
    # 3. Allow egress to Kubernetes API server for dynamic Secret lifecycle
    # Pre-DNAT ClusterIP rule (strictly TCP port 443 to Kubernetes Service ClusterIP)
    - to:
        - ipBlock:
            cidr: {{ .Values.gateway.k8sApiClusterIp | default "10.43.0.1/32" }}
      ports:
        - protocol: TCP
          port: 443
    # Post-DNAT control-plane host endpoint (strictly TCP port 6443 to verified control-plane node IP)
    - to:
        - ipBlock:
            cidr: {{ .Values.gateway.k8sControlPlaneEndpoint | default "172.19.0.2/32" }}
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: urumi-woocommerce-mcp-netpol
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-woocommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp-woocommerce
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming MCP traffic only from intended gateway workloads
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: gateway
        {{- if .Values.networkPolicy.allowTestClient }}
        # Explicitly local-only exception for development verification
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: test-client
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.upstreams.woocommerce.service.port | default 3000 }}
  egress:
    # Allow egress to WordPress REST API on port 80
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: wordpress
      ports:
        - protocol: TCP
          port: 80
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
