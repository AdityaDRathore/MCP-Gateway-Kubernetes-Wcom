{{- if .Values.gateway.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: urumi-gateway-secret-manager
  namespace: {{ .Values.gateway.secretsNamespace | default "urumi-gateway-secrets" | quote }}
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: urumi-gateway-secret-binding
  namespace: {{ .Values.gateway.secretsNamespace | default "urumi-gateway-secrets" | quote }}
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
subjects:
  - kind: ServiceAccount
    name: {{ .Values.gateway.serviceAccount.name | default "urumi-gateway-sa" | quote }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: Role
  name: urumi-gateway-secret-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
