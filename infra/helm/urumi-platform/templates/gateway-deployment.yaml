{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-gateway
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ .Values.gateway.serviceAccount.name | default "urumi-gateway-sa" | quote }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: volume-permissions
          image: {{ if .Values.gateway.digest }}{{ printf "%s@%s" .Values.gateway.image .Values.gateway.digest | quote }}{{ else }}{{ .Values.gateway.image | default "urumi-gateway:1.0.0" | quote }}{{ end }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy | default "IfNotPresent" | quote }}
          command:
            - sh
            - -c
            - "chown -R 10001:10001 /data && chmod 0700 /data"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          volumeMounts:
            - name: gateway-data
              mountPath: /data
      containers:
        - name: gateway
          image: {{ if .Values.gateway.digest }}{{ printf "%s@%s" .Values.gateway.image .Values.gateway.digest | quote }}{{ else }}{{ .Values.gateway.image | default "urumi-gateway:1.0.0" | quote }}{{ end }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy | default "IfNotPresent" | quote }}
          ports:
            - containerPort: {{ .Values.gateway.service.port | default 3000 }}
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: {{ if .Values.gateway.env }}{{ .Values.gateway.env.NODE_ENV | default "production" | quote }}{{ else }}"production"{{ end }}
            - name: PORT
              value: {{ .Values.gateway.service.port | default 3000 | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: {{ if .Values.gateway.env }}{{ .Values.gateway.env.LOG_LEVEL | default "info" | quote }}{{ else }}"info"{{ end }}
            - name: DB_PATH
              value: "/data/gateway.db"
            - name: DEFAULT_UPSTREAM_TIMEOUT_MS
              value: "10000"
            - name: MAX_PAYLOAD_SIZE_BYTES
              value: "65536"
            - name: DRAIN_TIMEOUT_MS
              value: "5000"
            - name: MAX_RESULT_SIZE_BYTES
              value: "1048576"
            - name: GLOBAL_CONCURRENCY_LIMIT
              value: "20"
            - name: PER_UPSTREAM_CONCURRENCY_LIMIT
              value: "4"
            - name: KUBERNETES_SECRETS_NAMESPACE
              value: {{ .Values.gateway.secretsNamespace | default "urumi-gateway-secrets" | quote }}
          volumeMounts:
            - name: gateway-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if .Values.gateway.resources }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: urumi-gateway-pvc
        - name: tmp
          emptyDir: {}
{{- end }}
