{{- if .Values.upstreams.tasks.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: urumi-mcp-tasks
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-tasks
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.upstreams.tasks.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "urumi-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-tasks
{{- end }}
