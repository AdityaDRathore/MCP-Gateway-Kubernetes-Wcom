apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urumi-platform.fullname" . }}-config
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
data:
  environment: {{ .Values.global.environment | quote }}
  store-domain: {{ .Values.store.domain | quote }}
  gateway-domain: {{ .Values.gateway.domain | quote }}
  store-port: {{ .Values.store.port | quote }}
  gateway-port: {{ .Values.gateway.port | quote }}
