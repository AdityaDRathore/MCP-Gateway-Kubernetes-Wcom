{{- if and .Values.store.enabled .Values.store.wordpress.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: urumi-wordpress-pvc
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.store.wordpress.persistence.storageClass }}
  storageClassName: {{ .Values.store.wordpress.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.store.wordpress.persistence.size | default "1Gi" | quote }}
{{- end }}
