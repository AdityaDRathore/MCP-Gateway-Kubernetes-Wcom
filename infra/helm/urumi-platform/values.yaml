# Default values for urumi-platform.
# These values are overridden by values-local.yaml and values-prod.yaml.

global:
  environment: "local"

ingress:
  className: "traefik"
  tls:
    enabled: false

store:
  enabled: true
  domain: "shop.127.0.0.1.nip.io"
  port: 8080
  wordpress:
    image: "wordpress:7.1.3-php8.3-apache"
    digest: "sha256:8ecd8d8e374167ea22235acf30f80d1165b82f07ffa5bcef90c1cad8f7be251f"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    persistence:
      enabled: true
      size: "1Gi"
      storageClass: "local-path"
  mariadb:
    image: "mariadb:11.4.5"
    digest: "sha256:49117dcc565cf51aa57ac5fca59ab31213402ff0eae6ffc13c46a37b938f7e4b"
    database: "wordpress"
    user: "wordpress_user"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "384Mi"
    persistence:
      enabled: true
      size: "1Gi"
      storageClass: "local-path"

gateway:
  enabled: true
  domain: "dashboard.127.0.0.1.nip.io"
  port: 8080
  image: "urumi-gateway:1.0.0"
  digest: ""
  imagePullPolicy: "IfNotPresent"
  replicas: 1
  service:
    port: 3000
  serviceAccount:
    name: "urumi-gateway-sa"
  secretsNamespace: "urumi-gateway-secrets"
  k8sApiClusterIp: "10.43.0.1/32"
  k8sControlPlaneEndpoint: "172.19.0.2/32"
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  persistence:
    enabled: true
    size: "500Mi"
    storageClass: "local-path"
  ingress:
    enabled: true
  env:
    NODE_ENV: "production"
    LOG_LEVEL: "info"

upstreams:
  woocommerce:
    enabled: true
    image: "urumi-woocommerce-mcp:1.0.0"
    digest: ""
    imagePullPolicy: "IfNotPresent"
    replicas: 1
    service:
      port: 3000
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "192Mi"
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    env:
      PORT: "3000"
      HOST: "0.0.0.0"
      WOOCOMMERCE_BASE_URL: "http://urumi-wordpress.urumi.svc.cluster.local:80"
      WOOCOMMERCE_SITE_URL: "http://shop.127.0.0.1.nip.io:8080"
      REQUEST_TIMEOUT_MS: "10000"
      NODE_ENV: "production"
      LOG_LEVEL: "info"
    secretName: "urumi-woocommerce-api"
  crm:
    enabled: true
    image: "mcp-crm:1.0.0"
    digest: ""
    imagePullPolicy: "IfNotPresent"
    replicas: 1
    service:
      port: 3000
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  tasks:
    enabled: true
    image: "mcp-tasks:1.0.0"
    digest: ""
    imagePullPolicy: "IfNotPresent"
    replicas: 1
    service:
      port: 3000
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

networkPolicy:
  enabled: true
  allowTestClient: false
